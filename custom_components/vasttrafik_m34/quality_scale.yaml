# Integration Quality Scale Status – Västtrafik M34 2.0.5
# Uppdaterad för att spegla faktisk implementation (inga hänvisningar till gamla radnummer).

rules:
  action-setup:
    status: exempt
    comment: Integrationen tillhandahåller inga service actions, bara sensorer.

  appropriate-polling:
    status: done
    comment: |
      DataUpdateCoordinator använder 60 s som standard (30–300 s via alternativ).
      Delad aiohttp-session från Home Assistant används för alla anrop.

  brands:
    status: exempt
    comment: |
      Ikon/logo för HACS finns i repositoryt. Brand-assets för Home Assistant
      hanteras i home-assistant/brands och ingår inte i en custom integration.

  common-modules:
    status: done
    comment: Konstanter i const.py, API/logik i coordinator.py, flöden i config_flow.py.

  config-flow-test-coverage:
    status: done
    comment: |
      tests/test_config_flow.py och tests/test_init.py kör mot HA:s testfixtures
      och täcker auth, sökning, val, dublett, reauth och options.

  config-flow:
    status: done
    comment: |
      GUI-flöde i tre steg (nyckel → sök → välj), med data_description i
      strings.json/translations/sv.json. Reauth-flöde för utgången nyckel.

  dependency-transparency:
    status: done
    comment: Inga externa PyPI-krav i manifest.json; aiohttp kommer från Home Assistant själv.

  docs-actions:
    status: exempt
    comment: Inga service actions att dokumentera.

  docs-high-level-description:
    status: done
    comment: README.md beskriver integrationen och Västtrafiks API.

  docs-installation-instructions:
    status: done
    comment: README.md innehåller HACS- och manuell installation samt API-nyckelssteg.

  docs-removal-instructions:
    status: done
    comment: README.md har en egen avinstallationssektion.

  entity-event-setup:
    status: exempt
    comment: DataUpdateCoordinator används, inga push-händelser.

  entity-unique-id:
    status: done
    comment: |
      Stabila unique_id: <gid>, <gid>_next_departure och <gid>_minutes_until i sensor.py.

  has-entity-name:
    status: done
    comment: Alla entiteter använder _attr_has_entity_name = True.

  runtime-data:
    status: done
    comment: |
      Coordinator lagras i entry.runtime_data (typad som VasttrafikConfigEntry)
      och läses av sensor-plattformen.

  test-before-configure:
    status: done
    comment: config_flödet verifierar nyckeln mot /token innan hållplats sparas.

  test-before-setup:
    status: done
    comment: |
      async_setup_entry kör coordinatorns första uppdatering och låter
      async_config_entry_first_refresh höja ConfigEntryNotReady vid fel utan giltig cache.

  unique-config-entry:
    status: done
    comment: async_set_unique_id + _abort_if_unique_id_configured på hållplatsens gid.
